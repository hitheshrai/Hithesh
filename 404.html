<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moved to hitheshrai.com</title>

    <!-- GitHub Pages cannot issue a server-side 301 for a project site, so the
         redirect is a meta refresh plus a script. The canonical link is what
         consolidates search ranking onto the new domain. -->
    <link rel="canonical" href="https://hitheshrai.com/" />
    <meta http-equiv="refresh" content="0; url=https://hitheshrai.com/" />
    <meta name="robots" content="noindex, follow" />

    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f2efe9;
        color: #1a1a18;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      p {
        margin: 0 0 0.75rem;
        font-size: 0.78rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #7c776e;
      }
      a {
        font-size: clamp(1.5rem, 5vw, 2.5rem);
        color: #1a1a18;
        text-decoration: none;
        border-bottom: 1px solid #8c4a2f;
      }
    </style>
  </head>

  <body>
    <main>
      <p>This site has moved</p>
      <a href="https://hitheshrai.com/">hitheshrai.com</a>
    </main>

    <script>
      (function () {
        // Old single-page anchors mapped onto the sections that replaced them,
        // so existing links land somewhere meaningful rather than at the top.
        var sections = {
          '#about': '#practice',
          '#research': '#atlas',
          '#projects': '#work',
          '#publications': '#papers',
          '#articles': '#papers',
          '#contact': '#contact'
        };
        var hash = window.location.hash;
        window.location.replace('https://hitheshrai.com/' + (sections[hash] || hash || ''));
      })();
    </script>
  </body>
</html>
